<!-- src/app/admin/company/company.component.html -->
<div *ngIf="toastr" id="toast-success" class="flex items-center p-4 mb-4 w-full max-w-xs text-gray-500 bg-white rounded-lg shadow">
  <div class="inline-flex justify-center items-center w-8 h-8 text-green-500 bg-green-100 rounded-lg">
    <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd"
        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
        clip-rule="evenodd"></path>
    </svg>
  </div>
  <div class="ml-3 text-sm font-normal">{{ alertMessage }}</div>
  <button type="button" (click)="toastr=false"
    class="ml-auto text-gray-400 hover:text-gray-900 rounded-lg p-1.5">✕</button>
</div>

<!-- Header -->
<div class="py-6">
  <div class="px-4 sm:px-6 lg:px-8">
    <div class="sm:flex sm:items-center mb-8">
      <div class="sm:flex-auto">
        <h1 class="text-xl font-semibold text-gray-900">Companies</h1>
      </div>
      <div class="mt-4 sm:mt-0 sm:ml-16 sm:flex-none">
        <button (click)="openModal()"
          class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-blue-700">
          Create Company
        </button>
      </div>
    </div>

    <!-- Search and Pagination Controls -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4 space-y-3 md:space-y-0">
      <div class="relative w-full md:w-1/3">
        <input [(ngModel)]="searchTerm" (input)="filterCompanies()"
          type="text" placeholder="Search by company name..."
          class="border border-gray-300 rounded-lg py-2 px-3 w-full focus:ring focus:ring-blue-200" />
      </div>

      <div class="text-gray-600 text-sm mt-2 md:mt-0">
        Showing {{ startIndex + 1 }} - {{ endIndex }} of {{ filteredCompanies.length }}
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white shadow rounded-lg p-4 overflow-x-auto">
      <table class="w-full border-collapse">
        <thead class="border-b bg-gray-100">
          <tr>
            <th class="py-3 px-5 text-left text-gray-600 font-medium">Name</th>
            <th class="py-3 px-5 text-left text-gray-600 font-medium">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of paginatedCompanies" class="hover:bg-gray-50">
            <td class="py-3 px-5 text-gray-800">{{ c.name }}</td>
            <td class="py-3 px-5">
              <button (click)="editCompany(c)"
                class="border border-blue-600 text-blue-600 px-3 py-1.5 rounded mr-2 hover:bg-blue-100">Edit</button>
              <button (click)="confirmDelete(c._id!)"
                class="border border-red-600 text-red-600 px-3 py-1.5 rounded hover:bg-red-100">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-between items-center mt-4">
      <button (click)="previousPage()" [disabled]="currentPage === 1"
        class="px-4 py-2 border rounded-lg hover:bg-gray-100 disabled:opacity-50">
        Previous
      </button>

      <div class="text-gray-700 text-sm">
        Page {{ currentPage }} of {{ totalPages }}
      </div>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages"
        class="px-4 py-2 border rounded-lg hover:bg-gray-100 disabled:opacity-50">
        Next
      </button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div *ngIf="popup" class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6">
    <h2 class="text-lg font-semibold mb-4">{{ editMode ? 'Edit Company' : 'Add Company' }}</h2>

    <form [formGroup]="companyForm" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">Company Name</label>
        <input type="text" formControlName="name"
          class="w-full border rounded p-2 focus:ring focus:ring-blue-300"
          placeholder="Enter company name" />
      </div>

      <div>
        <label class="block mb-1 font-medium">Description</label>
        <textarea formControlName="description" rows="3"
          class="w-full border rounded p-2 focus:ring focus:ring-blue-300"></textarea>
      </div>
    </form>

    <div class="mt-6 flex justify-end space-x-3">
      <button (click)="popup=false" class="border px-4 py-2 rounded hover:bg-gray-100">Cancel</button>
      <button *ngIf="!editMode" [disabled]="companyForm.invalid" (click)="addCompany()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
      <button *ngIf="editMode" [disabled]="companyForm.invalid" (click)="updateCompany()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Update</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<div *ngIf="confirmPopup" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-sm">
    <h3 class="text-lg font-semibold text-gray-800 mb-2">Delete Company</h3>
    <p class="text-gray-600 mb-4">Are you sure you want to delete this company?</p>
    <div class="flex justify-end space-x-3">
      <button (click)="confirmPopup=false" class="border px-4 py-2 rounded hover:bg-gray-100">Cancel</button>
      <button (click)="deleteCompany()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Delete</button>
    </div>
  </div>
</div>
