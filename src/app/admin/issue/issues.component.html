<!-- ✅ Toast Notification -->
<div *ngIf="toastr" class="fixed top-5 right-5 z-50 bg-green-100 border border-green-400 text-green-800 px-4 py-2 rounded-md shadow">
  {{ alertMessage }}
</div>

<!-- ✅ Main Layout -->
<div class="max-w-7xl mx-auto mt-10 bg-white shadow-md rounded-xl p-6">
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Issue Management</h2>

    <div class="flex items-center gap-2">
      <input type="text" placeholder="Search issues..." [(ngModel)]="searchQuery" (input)="onSearchChange()"
        class="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      <button (click)="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow">
        + Add Issue
      </button>
    </div>
  </div>

  <!-- ✅ Table -->
  <div class="overflow-x-auto">
    <table class="min-w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
      <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="px-4 py-3 text-left font-semibold">Name</th>
          <th class="px-4 py-3 text-left font-semibold">Description</th>
          <th class="px-4 py-3 text-left font-semibold">Image</th>
          <th class="px-4 py-3 text-center font-semibold">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let issue of issues" class="border-t hover:bg-gray-50 transition">
          <td class="px-4 py-3">{{ issue.name }}</td>
          <td class="px-4 py-3 truncate max-w-xs">{{ issue.description }}</td>
          <td class="px-4 py-3">
            <img *ngIf="issue.image" (click)="previewImage(issue.image)" [src]="'http://localhost:3000' + issue.image"
              class="h-12 w-12 object-cover rounded-md border cursor-pointer hover:scale-105 transition" />
          </td>
          <td class="px-4 py-3 text-center space-x-2">
            <button (click)="openModal(issue)" class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-md">Edit</button>
            <button (click)="confirmDeleteIssue(issue._id)" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-md">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ✅ Pagination -->
  <div class="flex justify-center items-center mt-6 space-x-2">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
      class="px-3 py-1 border rounded-md text-sm text-gray-700 disabled:opacity-50">Prev</button>

    <ng-container *ngFor="let page of [].constructor(totalPages); let i = index">
      <button (click)="goToPage(i + 1)"
        [ngClass]="currentPage === i + 1 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800'"
        class="px-3 py-1 border rounded-md text-sm">{{ i + 1 }}</button>
    </ng-container>

    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages"
      class="px-3 py-1 border rounded-md text-sm text-gray-700 disabled:opacity-50">Next</button>
  </div>
</div>

<!-- ✅ Add/Edit Modal -->
<div *ngIf="showFormModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg">
    <h3 class="text-xl font-semibold mb-4">{{ selectedIssue ? 'Edit Issue' : 'Add Issue' }}</h3>

    <form [formGroup]="issueForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Issue Name</label>
        <input formControlName="name" type="text"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:ring-blue-200" />
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="3"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:ring-blue-200"></textarea>
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Image (optional)</label>
        <input type="file" (change)="onImageSelect($event)"
          class="w-full border border-gray-300 rounded-md p-2" />
      </div>

      <div class="flex justify-end space-x-3 mt-4">
        <button type="button" (click)="closeModal()" class="px-4 py-2 border border-gray-400 text-gray-600 rounded-md">Cancel</button>
        <button type="button" (click)="saveIssue()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md shadow">
          {{ selectedIssue ? 'Update' : 'Add' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ✅ Image Preview Modal -->
<div *ngIf="showPreviewModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
  <div class="relative">
    <img [src]="previewImageUrl" class="max-h-[80vh] max-w-[90vw] rounded-lg shadow-lg" />
    <button (click)="showPreviewModal = false" class="absolute top-2 right-2 bg-white text-black rounded-full p-1">✕</button>
  </div>
</div>

<!-- ✅ Delete Confirmation -->
<div
  *ngIf="confirmDelete"
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 transition-opacity duration-300"
>
  <div
    class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform transition-all scale-100 hover:scale-[1.02]"
  >
    <!-- Title -->
    <h3 class="text-lg font-semibold text-gray-800 mb-3 flex items-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-6 h-6 text-red-600 mr-2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM4.318 6.318A9 9 0 1119.682 17.682 9 9 0 014.318 6.318z"
        />
      </svg>
      Delete Issue
    </h3>

    <!-- Message -->
    <p class="text-gray-600 mb-5 text-sm leading-relaxed">
      Are you sure you want to permanently delete this issue? <br />
      This action cannot be undone.
    </p>

    <!-- Buttons -->
    <div class="flex justify-end space-x-3">
      <!-- Cancel Button -->
      <button
        (click)="confirmDelete = false"
        class="px-4 py-2 border border-gray-400 text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-all rounded-md text-sm font-medium"
      >
        Cancel
      </button>

      <!-- Delete Button -->
      <button
        (click)="deleteIssue()"
        class="px-4 py-2 border border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition-all rounded-md text-sm font-medium"
      >
        Delete
      </button>
    </div>
  </div>
</div>
