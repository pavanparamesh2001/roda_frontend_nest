<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-xl w-full max-w-md p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="./assets/images/roda-logo.png" alt="Logo" class="w-32" />
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">
      Welcome Back
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring focus:ring-blue-200 outline-none"
          placeholder="Enter your email"
        />
        <p *ngIf="submitted && loginForm.controls['email'].invalid"
           class="text-red-600 text-sm mt-1">
          Valid email is required
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring focus:ring-blue-200 outline-none"
          placeholder="Enter your password"
        />
        <p *ngIf="submitted && loginForm.controls['password'].invalid"
           class="text-red-600 text-sm mt-1">
          Password is required
        </p>
      </div>

      <!-- Error Message -->
      <div *ngIf="loginError" class="text-red-700 bg-red-100 p-2 rounded text-sm">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg flex items-center justify-center"
      >
        <ng-container *ngIf="isLoading; else loginText">
          <span class="animate-spin rounded-full h-5 w-5 border-t-2 border-white mr-2"></span>
          Logging in...
        </ng-container>

        <ng-template #loginText>Sign In</ng-template>
      </button>
    </form>
  </div>
</div>
